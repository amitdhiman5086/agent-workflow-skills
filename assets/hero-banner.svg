<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Agent Workflow v2.0 — From Rough Idea to Verified PR">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes chipGlow {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      @keyframes stepHighlight {
        0%, 22% { opacity: 1; }
        28%, 100% { opacity: 0.42; }
      }
      .pulse { animation: pulseDot 2.2s ease-in-out infinite; }
      .chip-1 { animation: chipGlow 3.6s ease-in-out infinite 0s; }
      .chip-2 { animation: chipGlow 3.6s ease-in-out infinite 0.6s; }
      .chip-3 { animation: chipGlow 3.6s ease-in-out infinite 1.2s; }
      .chip-4 { animation: chipGlow 3.6s ease-in-out infinite 1.8s; }
      .chip-5 { animation: chipGlow 3.6s ease-in-out infinite 2.4s; }
      .chip-6 { animation: chipGlow 3.6s ease-in-out infinite 3.0s; }
      .st-1 { animation: stepHighlight 6s infinite 0s; }
      .st-2 { animation: stepHighlight 6s infinite 1.5s; }
      .st-3 { animation: stepHighlight 6s infinite 3.0s; }
      .st-4 { animation: stepHighlight 6s infinite 4.5s; }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .chip-1, .chip-2, .chip-3, .chip-4, .chip-5, .chip-6, .st-1, .st-2, .st-3, .st-4 { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#glow-blue)"/>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#glow-purple)"/>

  <!-- Version Pill -->
  <rect x="44" y="32" width="276" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="62" cy="46" r="4.5" fill="#3fb950" class="pulse"/>
  <text x="76" y="50" class="mono" font-size="11.5" font-weight="600" fill="#c9d1d9" letter-spacing="0.4">v2.0 · UNIVERSAL AGENT WORKFLOW</text>

  <!-- Headline & Subtitle (strictly within x=44..620) -->
  <text x="44" y="102" class="sans" font-size="33" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Rough Idea → Verified PR</text>
  <text x="44" y="132" class="sans" font-size="14.5" fill="#8b949e">Context-pack handoffs · &lt;100-word visual PRs · 1-command upgrades</text>

  <!-- Supported Agents Row -->
  <g transform="translate(44, 154)">
    <rect x="0" y="0" width="96" height="28" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" class="chip-1"/>
    <text x="48" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">Claude Code</text>

    <rect x="105" y="0" width="92" height="28" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.2" class="chip-2"/>
    <text x="151" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">Antigravity</text>

    <rect x="206" y="0" width="64" height="28" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.2" class="chip-3"/>
    <text x="238" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">Codex</text>

    <rect x="279" y="0" width="82" height="28" rx="7" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" class="chip-4"/>
    <text x="320" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">OpenCode</text>

    <rect x="370" y="0" width="66" height="28" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.2" class="chip-5"/>
    <text x="403" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">Cursor</text>

    <rect x="445" y="0" width="90" height="28" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.2" class="chip-6"/>
    <text x="490" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">Gemini CLI</text>
  </g>

  <!-- Bottom Feature Strip (comfortably ends around x=600) -->
  <g transform="translate(44, 216)" class="sans" font-size="12.5" fill="#8b949e">
    <circle cx="5" cy="-4" r="3.5" fill="#58a6ff"/>
    <text x="15" y="0"><tspan fill="#e6edf3" font-weight="600">13</tspan> Skills</text>

    <circle cx="96" cy="-4" r="3.5" fill="#a371f7"/>
    <text x="106" y="0"><tspan fill="#e6edf3" font-weight="600">Must-Fix</tspan> Review</text>

    <circle cx="232" cy="-4" r="3.5" fill="#3fb950"/>
    <text x="242" y="0"><tspan fill="#e6edf3" font-weight="600">Zero-Noise</tspan> State</text>

    <circle cx="372" cy="-4" r="3.5" fill="#d29922"/>
    <text x="382" y="0"><tspan fill="#e6edf3" font-weight="600">1-Cmd</tspan> Upgrade</text>
  </g>

  <!-- Right Live Mini-Flow Card -->
  <g transform="translate(658, 28)">
    <rect x="0" y="0" width="266" height="204" rx="12" fill="#161b22" fill-opacity="0.95" stroke="#30363d" stroke-width="1.2"/>
    <path d="M 32 38 L 32 166" stroke="url(#line-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle r="5" fill="#58a6ff">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 32 38 L 32 166"/>
    </circle>

    <g class="st-1">
      <circle cx="32" cy="38" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
      <text x="50" y="36" class="mono" font-size="12" font-weight="700" fill="#f0f6fc">/capture → /size</text>
      <text x="50" y="51" class="sans" font-size="11" fill="#8b949e">S/M/L + vertical slices</text>
    </g>

    <g class="st-2">
      <circle cx="32" cy="81" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
      <text x="50" y="79" class="mono" font-size="12" font-weight="700" fill="#f0f6fc">/groom</text>
      <text x="50" y="94" class="sans" font-size="11" fill="#8b949e">Context pack + Route hint</text>
    </g>

    <g class="st-3">
      <circle cx="32" cy="124" r="7" fill="#0d1117" stroke="#a371f7" stroke-width="2.5"/>
      <text x="50" y="122" class="mono" font-size="12" font-weight="700" fill="#f0f6fc">/runner + /review-loop</text>
      <text x="50" y="137" class="sans" font-size="11" fill="#8b949e">TDD build + fresh verification</text>
    </g>

    <g class="st-4">
      <circle cx="32" cy="166" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
      <text x="50" y="164" class="mono" font-size="12" font-weight="700" fill="#3fb950">Merged → /close-out ✔</text>
      <text x="50" y="179" class="sans" font-size="11" fill="#8b949e">&lt;100w PR + clean close</text>
    </g>
  </g>
</svg>
